# Optional. Not started by deploy.sh automatically — enable manually if/when you want
# this box's container logs + host metrics flowing into the existing org Loki/Prometheus
# stack:
#
#   cd deploy/hetzner/monitoring && cp .env.example .env   # fill in the two CF-Access values
#   docker compose up -d
#
services:
    promtail:
        image: grafana/promtail:2.9.7
        restart: unless-stopped
        command: ["-config.file=/etc/promtail/config.yaml", "-config.expand-env=true"]
        volumes:
            - ./promtail-config.yaml:/etc/promtail/config.yaml
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/log:/var/log:ro
        env_file:
            - .env

    node-exporter:
        image: quay.io/prometheus/node-exporter:latest
        restart: unless-stopped
        ports:
            - "9100:9100"
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - '--path.procfs=/host/proc'
            - '--path.sysfs=/host/sys'
            - '--path.rootfs=/rootfs'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
